name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and sign
        run: |
          unzip -q "*.zip"
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar apktool.jar b base_src -o unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          AJ=$(ls -d $ANDROID_HOME/platforms/android-[0-9][0-9] | sort -V | tail -1)/android.jar
          mkdir cls dexout
          javac --release 8 -cp "$AJ" -d cls extra/gm/*.java
          $BT/d8 --min-api 21 --lib "$AJ" --output dexout $(find cls -name '*.class')
          mv dexout/classes.dex dexout/classes2.dex
          (cd dexout && zip -q ../unsigned.apk classes2.dex)
          $BT/zipalign -f -p 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks gm-release.jks --ks-pass pass:gmtools123 --key-pass pass:gmtools123 --out GrandMobileTools.apk aligned.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: GrandMobileTools.apk
